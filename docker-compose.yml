version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dock_appointments_db
    environment:
      POSTGRES_USER: dockuser
      POSTGRES_PASSWORD: dockpassword
      POSTGRES_DB: dock_appointments
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dock_appointments_backend
    env_file:
      - ./backend/.env
    environment: &backend_environment
      DATABASE_URL: postgresql://dockuser:dockpassword@postgres:5432/dock_appointments
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  outbox_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dock_appointments_outbox_worker
    command: ["python", "outbox_worker.py"]
    profiles: ["integration"]
    env_file:
      - ./backend/.env
    environment:
      <<: *backend_environment
      OPERATIONS_API_URL: ${OPERATIONS_API_URL:-http://host.docker.internal:8001/api/v1/integration}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dock_appointments_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
