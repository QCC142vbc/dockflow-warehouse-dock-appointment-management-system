version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dock_appointments_db
    environment:
      POSTGRES_USER: dockuser
      POSTGRES_PASSWORD: dockpassword
      POSTGRES_DB: dock_appointments
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dock_appointments_backend
    environment:
      DATABASE_URL: postgresql://dockuser:dockpassword@postgres:5432/dock_appointments
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dock_appointments_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
